---
# Build and publish the five images the deployment pulls.
#
# Three of them are thin and build in a couple of minutes, so they are built for
# both architectures in one go under emulation. Two are not, and they are slow in
# different ways, which is why each has its own job:
#
#   consort-web compiles the Jitsi app from the fork. What it produces is
#   JavaScript, so it compiles ONCE on the build machine and upstream's own
#   multi-arch image supplies the per-architecture half.
#
#   consort-server compiles Zulip, whose output is not architecture-independent.
#   Under QEMU that turns 30 minutes into most of a day, so it is built on a
#   native runner per architecture and stitched into one manifest afterwards.
#
# AFTER THE FIRST SUCCESSFUL RUN: GHCR creates new packages as *private*, even
# from a public repository, and a private package is exactly as useless to a
# stranger as no package at all. For each of the five, open its page under the
# org's Packages tab -> Package settings -> change visibility to Public, and
# connect it to this repository while you are there.
#
# consort-web-upstream is new as of the switch to a compiled app, so it needs
# that treatment even though the others already have it.

name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      zulip_git_ref:
        description: "Ref of the Zulip fork to build"
        default: lounges
      jitsi_image_version:
        description: "Upstream Jitsi image tag to layer on"
        default: unstable-2026-06-25
      # Deliberately without defaults. These are read as `inputs.x || '<sha>'`, so
      # a default here is not a fallback — it is an override that beats the sha
      # below on every manually started run, and it beats it silently. Left with
      # their own copies of the sha, the two drifted apart the first time the
      # forks moved, and a build started from the Actions tab compiled the
      # previous app and reported success. Empty means "use the sha below",
      # which is the only answer anyone wants unless they type one.
      jitsi_meet_ref:
        description: "Ref of the jitsi-meet fork to compile (blank = the pinned sha)"
      lib_jitsi_meet_ref:
        description: "Ref of the lib-jitsi-meet fork to compile (blank = the pinned sha)"

env:
  # Must agree with JITSI_IMAGE_VERSION in deploy/.env.example: prosody and web
  # are layered on this, while jicofo and jvb are pulled at it directly, and a
  # mismatched set is a bad afternoon. Note that a docker-jitsi-meet *release*
  # tag is not an *image* tag — the published ones are dated unstable-YYYY-MM-DD.
  JITSI_IMAGE_VERSION: ${{ inputs.jitsi_image_version || 'unstable-2026-06-25' }}
  ZULIP_GIT_URL: https://github.com/Dyslectric/zulip-meet-integration
  ZULIP_GIT_REF: ${{ inputs.zulip_git_ref || 'lounges' }}
  # The Jitsi fork the web app is compiled from. HTTPS rather than the SSH
  # remotes these are cloned with locally: the build clones unauthenticated, so
  # both repositories have to stay public.
  #
  # Commits now, not the branch. The audio work has settled, which is the point
  # this was waiting for — and with a branch it could not be trusted anyway: the
  # clone layer is cached under scope=web-src and keyed on the text of the RUN
  # that performs it, so a branch name that never changes is a cache hit however
  # far the fork has moved. Builds after this one that need new fork code must
  # move these SHAs; changing only the fork is a build that reports success and
  # ships the code before it.
  LJM_REPO: https://github.com/Dyslectric/lib-jitsi-meet.git
  LJM_REF: ${{ inputs.lib_jitsi_meet_ref || 'df60d5c9' }}
  JM_REPO: https://github.com/Dyslectric/jitsi-meet.git
  JM_REF: ${{ inputs.jitsi_meet_ref || '560257213' }}
  # The build context for docker-zulip's own Dockerfile, pinned to the same tag
  # as deploy/vendor/docker-zulip/compose.yaml so the image and the compose file
  # that runs it come from one release.
  DOCKER_ZULIP_CONTEXT: "https://github.com/zulip/docker-zulip.git#12.1-0"

jobs:
  # ---------------------------------------------------------------------------
  # The three quick ones
  # ---------------------------------------------------------------------------
  thin:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: conferencing
            context: consort-conferencing
            dockerfile: consort-conferencing/Dockerfile
          # Both Jitsi images take the repository root as their context, because
          # each needs a file from outside its own directory: the speaking relay
          # in embedded-call/, the Lua in jitsi-token-harness/ and
          # consort-conferencing/. The root .dockerignore keeps that small.
          - name: prosody
            context: .
            dockerfile: deploy/images/prosody/Dockerfile
          # The published Jitsi app with the relay layered on: seconds to build,
          # and no longer what the deployment runs by default. It stays because
          # it is the fallback — CONSORT_WEB_IMAGE in .env swaps it back in
          # without a rebuild when a source build misbehaves in the stack.
          - name: web-upstream
            context: .
            dockerfile: deploy/images/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/consort-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JITSI_IMAGE_VERSION=${{ env.JITSI_IMAGE_VERSION }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------------------------------------------------------------------------
  # The Jitsi web app, compiled from the fork
  # ---------------------------------------------------------------------------
  #
  # Its own job rather than a fourth row in the matrix above, because it is not
  # thin: two npm installs and a webpack build, around ten minutes against
  # seconds for the others, and it wants its own cache scope and timeout.
  #
  # Not split across native runners the way Zulip is, either. What this compiles
  # is JavaScript and CSS — architecture-independent — so the Dockerfile pins the
  # compile stage to $BUILDPLATFORM and it runs once, natively, with upstream's
  # own multi-arch image supplying the per-architecture half. One runner, one
  # compile, a manifest for both.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/consort-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/web-src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JITSI_IMAGE_VERSION=${{ env.JITSI_IMAGE_VERSION }}
            LJM_REPO=${{ env.LJM_REPO }}
            LJM_REF=${{ env.LJM_REF }}
            JM_REPO=${{ env.JM_REPO }}
            JM_REF=${{ env.JM_REF }}
          cache-from: type=gha,scope=web-src
          cache-to: type=gha,mode=max,scope=web-src

  # ---------------------------------------------------------------------------
  # Zulip: one native runner per architecture, merged afterwards
  # ---------------------------------------------------------------------------
  zulip:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          # Free for public repositories, and the only way this build finishes
          # in a reasonable time for ARM.
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Reclaim disk
        # A hosted runner ships with several toolchains this build will never
        # use, and a Zulip image plus its build cache does not fit alongside
        # them. The failure without this is an opaque "no space left on device"
        # forty minutes in.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          # docker-zulip's own context, fetched straight from git, so there is no
          # second copy of it in this repository to keep in step.
          context: ${{ env.DOCKER_ZULIP_CONTEXT }}
          platforms: ${{ matrix.platform }}
          build-args: |
            ZULIP_GIT_URL=${{ env.ZULIP_GIT_URL }}
            ZULIP_GIT_REF=${{ env.ZULIP_GIT_REF }}
          # No tag here: each architecture is pushed as a bare digest and the
          # next job assembles them into one multi-arch tag. Tagging both would
          # mean whichever finished last silently won.
          outputs: type=image,name=ghcr.io/${{ steps.owner.outputs.name }}/consort-server,push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          # The filename is the bare hex, with the algorithm prefix stripped:
          # upload-artifact rejects a colon outright (NTFS cannot store one), and
          # the merge step puts the "sha256:" back when it builds the reference.
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  zulip-manifest:
    needs: [zulip]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Lowercase the owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/consort-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Assemble the multi-arch tag
        working-directory: /tmp/digests
        run: |
          # Both expansions are meant to split: the first into one -t per tag,
          # the second into one image reference per architecture digest. Quoting
          # either would hand imagetools a single argument containing spaces.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf 'ghcr.io/${{ steps.owner.outputs.name }}/consort-server@sha256:%s ' *)
