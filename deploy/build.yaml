---
# Build the four images locally instead of pulling them.
#
# Add it to COMPOSE_FILE in .env — `consort up --build` does that for you —
# and the stack runs with no registry involved at all. Useful for three things:
# hacking on any of the four components, running before the images have ever been
# published, and reproducing a build that CI got wrong.
#
# Three of the four are quick: the two Jitsi images are thin layers over upstream,
# and the conferencing service is a small Python app. Zulip is the slow one — it
# builds the server and its frontend from source, which is 20-45 minutes and
# several GB of scratch space. It is also the one that changes least often.

services:
  # Upstream's own build context, fetched by BuildKit straight from git at the
  # tag vendor/docker-zulip/compose.yaml is pinned to, so there is no second copy
  # of docker-zulip in this repository to keep in step. The two build args are the
  # entire difference from a stock Zulip image: which repository to build, and
  # which ref of it.
  zulip:
    build:
      context: "https://github.com/zulip/docker-zulip.git#12.1-0"
      args:
        ZULIP_GIT_URL: ${ZULIP_GIT_URL:-https://github.com/Dyslectric/zulip-meet-integration}
        ZULIP_GIT_REF: ${ZULIP_GIT_REF:-lounges}

  conferencing:
    build:
      context: ../consort-conferencing

  # Both Jitsi images take the repository root as their context, because each
  # needs a file that lives outside its own directory — the speaking relay in
  # embedded-call/, the Lua in jitsi-token-harness/ and consort-conferencing/.
  # The root .dockerignore keeps that from shipping the demo video.
  prosody:
    build:
      context: ..
      dockerfile: deploy/images/prosody/Dockerfile
      args:
        JITSI_IMAGE_VERSION: ${JITSI_IMAGE_VERSION:-unstable-2026-06-25}

  # Two Dockerfiles, one service. images/web layers a script onto the published
  # app and takes seconds; images/web-src compiles the app from source, takes ten
  # minutes, and is the only one that can carry a change to lib-jitsi-meet.
  #
  # Selected by variable rather than by editing this file, so a source build that
  # misbehaves in the stack can be backed out with one env line rather than a
  # commit. The four fork variables are read only by web-src; building the
  # prebuilt path with them set draws an unused-build-arg warning from Docker and
  # nothing worse.
  web:
    build:
      context: ..
      dockerfile: ${JITSI_WEB_DOCKERFILE:-deploy/images/web/Dockerfile}
      args:
        JITSI_IMAGE_VERSION: ${JITSI_IMAGE_VERSION:-unstable-2026-06-25}
        LJM_REPO: ${LJM_REPO:-https://github.com/jitsi/lib-jitsi-meet.git}
        LJM_REF: ${LJM_REF:-master}
        JM_REPO: ${JM_REPO:-https://github.com/jitsi/jitsi-meet.git}
        JM_REF: ${JM_REF:-master}
