---
# Everything Consort changes about the two vendored upstream compose files,
# plus the three services they know nothing about.
#
# The files under vendor/ are byte-for-byte upstream at a pinned tag and are
# never edited. That is the whole point of this file: the previous deployment
# edited docker-jitsi-meet's own 529-line compose in place, which made every
# upstream bump a manual merge against changes nobody had written down. Here the
# diff against upstream *is* this file.
#
# Loaded together with the vendored files through COMPOSE_FILE in .env, so a bare
# `docker compose up -d` in this directory gets all three in the right order.

secrets:
  # docker-zulip's compose.yaml references these but deliberately does not define
  # them — where the values come from is the operator's decision. They come from
  # files written by the installer with 0600 permissions, because the alternative
  # (environment:) puts them in `docker inspect` output for anything that can
  # reach the daemon.
  zulip__postgres_password:
    file: ./secrets/postgres_password
  zulip__memcached_password:
    file: ./secrets/memcached_password
  zulip__rabbitmq_password:
    file: ./secrets/rabbitmq_password
  zulip__redis_password:
    file: ./secrets/redis_password
  zulip__secret_key:
    file: ./secrets/secret_key
  zulip__email_password:
    file: ./secrets/email_password
  # The Web Push signing keypair. Both halves go through the same file route as
  # the rest: the private key because it is a private key, and the public one
  # beside it only so that the two cannot drift apart — a public key from one
  # pair and a private key from another produces a server that reports push as
  # enabled and delivers nothing.
  #
  # Losing or regenerating these is not equivalent to losing a password. Every
  # browser subscription is bound to the public key it subscribed with, so a new
  # pair silently invalidates every device already subscribed, and each one has
  # to subscribe again before it hears anything. `generate` therefore writes
  # them once and never rewrites them.
  zulip__vapid_private_key:
    file: ./secrets/vapid_private_key
  zulip__vapid_public_key:
    file: ./secrets/vapid_public_key
  # The contact address signed into every push request as the JWT's `sub`. Not
  # secret, and here only because this file route is how a value reaches
  # zulip-secrets.conf, which is where the server reads it from.
  #
  # Left unset the server falls back to a `localhost` address that Apple's push
  # service rejects outright, silencing every iOS device while Android carries on
  # as if push were healthy. `generate` writes this on every run.
  zulip__vapid_contact_email:
    file: ./secrets/vapid_contact_email

services:
  # ---------------------------------------------------------------------------
  # Ingress
  # ---------------------------------------------------------------------------

  # The one thing on the host. Both origins are served here on a single port,
  # separated by hostname, for two reasons: cookies ignore ports, so two ports on
  # `localhost` would share a cookie jar between Zulip and the meet app; and
  # Jitsi's external_api.js hardcodes `https://` when it builds the iframe URL,
  # so the meet origin has to be HTTPS whatever else happens.
  #
  # This is also what the production profile will use, with the internal CA
  # swapped for ACME — the same topology the live deployment already runs behind
  # Traefik, so there is one ingress story rather than two.
  caddy:
    image: caddy:2-alpine
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${INGRESS_PORT:-8443}:${INGRESS_PORT:-8443}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The internal CA's root key lives here. Losing it means every browser that
      # trusted the old root has to be told about a new one, so it is a named
      # volume rather than anything that gets cleaned up with the containers.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      ZULIP_HOST: ${ZULIP_HOST:-zulip.localhost}
      MEET_HOST: ${MEET_HOST:-meet.localhost}
      INGRESS_PORT: ${INGRESS_PORT:-8443}
    networks:
      - edge
      - meet.jitsi
    depends_on:
      - zulip
      - web

  # ---------------------------------------------------------------------------
  # Conferencing service
  # ---------------------------------------------------------------------------

  # Owns call state and occupancy. Prosody pushes to it over meet.jitsi; it calls
  # back into Zulip's internal hook over edge.
  conferencing:
    image: ghcr.io/dyslectric/consort-conferencing:${CONSORT_VERSION:-latest}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      ZULIP_SITE: https://${ZULIP_HOST:-zulip.localhost}:${INGRESS_PORT:-8443}
      # Written back into .env by `consort bootstrap` once the bot exists —
      # there is no way to have them before Zulip has booted and made one.
      ZULIP_EMAIL: ${CONFERENCING_BOT_EMAIL:-}
      ZULIP_API_KEY: ${CONFERENCING_BOT_API_KEY:-}
      # Straight to the container over the internal network rather than back out
      # through Caddy. TLS verification is off because the hop never leaves the
      # docker host and there is no certificate for `zulip`; the bearer secret is
      # the authentication. ZULIP_HOOK_HOST is what Django matches against
      # ALLOWED_HOSTS, which is derived from EXTERNAL_HOST, so it must be the
      # public name even though the connection is internal.
      ZULIP_HOOK_URL: http://zulip/api/internal/jitsi
      ZULIP_HOOK_HOST: ${ZULIP_HOST:-zulip.localhost}
      ZULIP_HOOK_VERIFY_TLS: "false"
      # One value, three consumers (here, prosody, and Zulip's secrets below).
      # Defined once in compose rather than three times in .env so the identity
      # is structural: a mismatch used to be a silent, undebuggable auth failure.
      EVENT_SYNC_SECRET: ${SHARED_SECRET:?SHARED_SECRET is required}
      CENSUS_URL: http://prosody:5280/room-census
      # Off until the bot key exists; `consort bootstrap` turns it on.
      EVENT_LOOP: ${CONFERENCING_EVENT_LOOP:-0}
    networks:
      - edge
      - meet.jitsi

  # ---------------------------------------------------------------------------
  # Zulip
  # ---------------------------------------------------------------------------

  zulip:
    image: ghcr.io/dyslectric/consort-server:${CONSORT_VERSION:-latest}
    # Upstream publishes 25, 80 and 443 straight onto the host. Caddy is the only
    # thing that should be listening, so drop the list rather than adding to it —
    # compose concatenates `ports` across files, it does not replace.
    ports: !reset null
    # Upstream can build the image from its own directory; we always pull.
    build: !reset null
    # Concatenated with the six upstream already asks for, not replacing them —
    # compose joins `secrets` across files the same way it joins `ports`. The
    # image maps every `zulip__<name>` it is given into zulip-secrets.conf as
    # `<name>`, which is how `secret_key` and `email_password` arrive; these two
    # ride the same mechanism rather than needing one of their own.
    secrets:
      - zulip__vapid_private_key
      - zulip__vapid_public_key
      - zulip__vapid_contact_email
    env_file:
      # SAML. A file rather than more `environment:` entries below, because its
      # contents are *generated*: SOCIAL_AUTH_SAML_ENABLED_IDPS is a Python
      # literal built by `consort generate` out of the metadata document the IdP
      # publishes, so that nobody transcribes an entity ID or an SSO URL.
      #
      # Nothing this file sets may also be named under `environment:` below —
      # `environment` wins, and the loss would be silent.
      #
      # `required: false` is for the bare `docker compose up -d` this directory
      # is meant to support. `generate` always writes the file, but a checkout
      # that has never run it should not fail to start over an SSO setup it is
      # not using. (Long-form env_file needs Compose 2.24, which preflight
      # already requires for !reset and !override.)
      - path: ./generated/saml/idps.env
        required: false
    volumes:
      # nginx's allow-list for the internal hook. Generated rather than shipped,
      # because it names the subnet the conferencing service calls from and that
      # is a deployment fact, not a constant. See zulip/jitsi-hook.conf.template.
      - ./generated/jitsi-hook.conf:/etc/nginx/zulip-include/app.d/jitsi-hook.conf:ro
      # The IdP signing certificates, one per enabled SAML profile. Zulip reads
      # /etc/zulip/saml/idps/<idp name>.crt by itself, so matching the file name
      # to the profile name is the entire wiring — there is no path to configure
      # and nothing to keep in step. These are public keys, which is why they are
      # in generated/ and not secrets/: the IdP serves them at a URL to anyone
      # who asks.
      - ./generated/saml/idps:/etc/zulip/saml/idps:ro
    environment:
      SETTING_EXTERNAL_HOST: ${ZULIP_HOST:-zulip.localhost}:${INGRESS_PORT:-8443}
      SETTING_ZULIP_ADMINISTRATOR: ${ZULIP_ADMIN_EMAIL:-admin@example.com}
      # This has to be stated, not left to Zulip, and the reason is an ordering
      # trap in the image. Every SETTING_ variable is *appended* to a copy of
      # prod_settings_template.py, but that template contains
      #
      #   SOCIAL_AUTH_SAML_SP_ENTITY_ID = "https://" + EXTERNAL_HOST
      #
      # which runs while EXTERNAL_HOST is still the template's own placeholder.
      # The append above fixes EXTERNAL_HOST long after that line has already
      # been evaluated, so the SP announces itself as https://zulip.example.com
      # and the IdP's assertion is refused with "not a valid audience" — a
      # failure that shows up as the login page reappearing with nothing said.
      # Only two lines in that template read EXTERNAL_HOST at load time and both
      # are SAML; the other sets the Organization block of the SP metadata, which
      # nothing consumes.
      #
      # Whatever this is must be the Audience configured on the IdP side.
      SETTING_SOCIAL_AUTH_SAML_SP_ENTITY_ID: https://${ZULIP_HOST:-zulip.localhost}:${INGRESS_PORT:-8443}
      # TLS terminates at Caddy, so Zulip has to be told which addresses are
      # allowed to speak for a client. This is the same CIDR the hook's nginx
      # block allows, and both Caddy and the conferencing service sit inside it.
      LOADBALANCER_IPS: ${EDGE_SUBNET:-10.87.0.0/24}
      # The Jitsi settings, all of which now have defaults in the fork's
      # default_settings.py — so this is the entire Zulip-side configuration and
      # there is no settings.py to template or mount.
      SETTING_JITSI_SERVER_URL: https://${MEET_HOST:-meet.localhost}:${INGRESS_PORT:-8443}
      # Same variable Jitsi's own JWT_APP_ID comes from: the token's `aud`/app id
      # has to agree on both sides or Prosody rejects every token.
      SETTING_JITSI_JWT_APP_ID: ${JWT_APP_ID:-zulip}
      SETTING_JITSI_DEFAULT_TENANT: ${JITSI_DEFAULT_TENANT:-root}
      # Whether channels may be made readable without logging in. Off unless
      # asked for: Zulip requires the server to say yes before an organization
      # can, deliberately, so that nothing becomes world-readable through an
      # organization setting alone.
      #
      # This is the first of three gates, not a switch. An administrator still
      # has to enable spectator access for the organization, and then mark a
      # channel web-public; see Realm.web_public_streams_enabled(). Turning this
      # on therefore publishes nothing by itself, which is the point of it being
      # separate.
      #
      # True or False, exactly — `generate` refuses anything else, because the
      # image decides how to write this from the shape of the value and a value
      # it reads as a string is quoted, and a non-empty quoted string is truthy.
      # "yes" would not fail; it would enable the feature and look like a typo.
      SETTING_WEB_PUBLIC_STREAMS_ENABLED: ${WEB_PUBLIC_STREAMS_ENABLED:-False}
      SETTING_JITSI_CONFERENCING_URL: http://conferencing:8080
      # Presence tuning, which is really notification tuning: how long someone
      # has to stop touching an open client before the server considers them
      # away and starts sending push again. Upstream's defaults are here
      # verbatim, so leaving these alone changes nothing.
      #
      # The three move together and `generate` refuses combinations that do not
      # hold up. The server asserts `3 * ping + 20 <= threshold` on every
      # presence update, and the timestamp the threshold is compared against is
      # only rewritten once per `update_min_freq`, so a threshold that does not
      # clear `update_min_freq + ping` marks someone who is actively typing as
      # away and notifies them mid-sentence.
      #
      # Shortening these costs presence traffic: every client polls on the ping
      # interval and each poll can write a row. Cheap for a handful of people,
      # which is what upstream's larger defaults are protecting against.
      SETTING_OFFLINE_THRESHOLD_SECS: ${PRESENCE_OFFLINE_THRESHOLD_SECS:-200}
      SETTING_PRESENCE_PING_INTERVAL_SECS: ${PRESENCE_PING_INTERVAL_SECS:-60}
      SETTING_PRESENCE_UPDATE_MIN_FREQ_SECONDS: ${PRESENCE_UPDATE_MIN_FREQ_SECONDS:-55}
      # The other half of the same question, for a client that stopped being
      # there rather than one sitting idle. Presence above answers "open, but
      # untouched"; these answer "gone without saying so" -- a locked phone, a
      # suspended laptop, a swiped-away app. Until the server gives up on the
      # connection the user still counts as present and gets no notification,
      # and messages that arrived meanwhile wait for the same moment.
      #
      # Lowering the timeout alone declares live clients dead: the heartbeat
      # reconnect is the only sign a client is still there, so it has to come
      # down first. `generate` refuses pairs where it did not.
      SETTING_EVENT_QUEUE_OFFLINE_TIMEOUT_SECS: ${EVENT_QUEUE_OFFLINE_TIMEOUT_SECS:-600}
      SETTING_EVENT_QUEUE_GC_FREQ_SECS: ${EVENT_QUEUE_GC_FREQ_SECS:-60}
      SETTING_EVENT_QUEUE_HEARTBEAT_MIN_FREQ_SECS: ${EVENT_QUEUE_HEARTBEAT_MIN_FREQ_SECS:-45}
      SECRETS_jitsi_jwt_app_secret: ${JITSI_JWT_SECRET:?JITSI_JWT_SECRET is required}
      SECRETS_jitsi_room_key: ${JITSI_ROOM_KEY:?JITSI_ROOM_KEY is required}
      SECRETS_jitsi_conferencing_secret: ${SHARED_SECRET:?SHARED_SECRET is required}
    networks:
      - default
      - edge

  # The four stock backing services only need to be reachable by Zulip, which is
  # the default network; they are named here solely to keep them off `edge`.
  database:
    networks: [default]
  memcached:
    networks: [default]
  rabbitmq:
    networks: [default]
  redis:
    networks: [default]

  # ---------------------------------------------------------------------------
  # Jitsi
  # ---------------------------------------------------------------------------

  web:
    # The Jitsi app compiled from this project's fork, plus
    # jitsi-speaking-relay.js — the only place per-participant audio levels exist,
    # since the External API exposes just the single dominant speaker.
    #
    # Compiled rather than layered because the audio work is not reachable in a
    # built bundle: screen share audio as its own track changes lib-jitsi-meet,
    # and enableAdvancedAudioSettings — without which every control in the audio
    # menu stores a preference nothing consults — is appended to the config
    # template by that image and not by the prebuilt one.
    #
    # CONSORT_WEB_IMAGE is the way back. Point it at consort-web-upstream and the
    # stack runs the published Jitsi app with only the relay added, which is a
    # pull rather than a rebuild — worth having while the fork moves.
    image: ${CONSORT_WEB_IMAGE:-ghcr.io/dyslectric/consort-web}:${CONSORT_VERSION:-latest}
    # Upstream publishes ${HTTP_PORT}:8000 and ${HTTPS_PORT}:8443 on the host.
    # Caddy reaches it as `web:8000` over the docker network instead.
    ports: !reset null
    # Named volumes instead of upstream's ${CONFIG}/... bind mounts, mirroring
    # them one for one (the container's root filesystem is read-only, so a path
    # it writes to has to stay a mount). Docker creates a missing bind-mount
    # source as root, and every Jitsi container then refuses to start with
    # "directory is not writable by the container user (uid 1000)" — a landmine
    # that costs a new operator half an hour and cannot happen with these.
    volumes: !override
      - jitsi-web-config:/config
      - jitsi-web-storage:/storage
      - jitsi-web-transcripts:/usr/share/jitsi-meet/transcripts:ro
      - jitsi-web-crontabs:/var/spool/cron/crontabs
      - jitsi-web-load-test:/usr/share/jitsi-meet/load-test
    networks:
      - meet.jitsi

  prosody:
    # Custom image: the event_sync component config, plus the contrib modules
    # that are not in the stock image.
    image: ghcr.io/dyslectric/consort-prosody:${CONSORT_VERSION:-latest}
    environment:
      # docker-jitsi-meet forwards only a curated list of variables into this
      # container, so anything not on that list has to be named explicitly here —
      # putting it in .env alone does nothing.
      EVENT_SYNC_SECRET: ${SHARED_SECRET:?SHARED_SECRET is required}
      JWT_APP_SECRET: ${JITSI_JWT_SECRET:?JITSI_JWT_SECRET is required}
      # token_affiliation is what reads context.user.moderator out of the JWT. It
      # ships in the image but is NOT enabled by default, and without it every
      # moderator decision Zulip makes is decorative. muc_census backs occupancy
      # reconciliation; token_no_wildcard refuses a token claiming every room.
      XMPP_MUC_MODULES: token_no_wildcard,muc_census,token_affiliation_legacy,token_affiliation
    # The plugins and event_sync.cfg.lua are baked into the image, so the
    # prosody-plugins-custom mount upstream expects is not needed here.
    volumes: !override
      - jitsi-prosody-config:/config
      - jitsi-prosody-storage:/var/lib/prosody
    networks:
      meet.jitsi:
        aliases:
          - ${XMPP_SERVER:-xmpp.meet.jitsi}

  jicofo:
    # Upstream binds its REST port to 127.0.0.1:8888, which collides with enough
    # other software to be worth not having; nothing here uses it.
    ports: !reset null
    volumes: !override
      - jitsi-jicofo-config:/config
    networks:
      - meet.jitsi

  jvb:
    # The media port genuinely has to be published — it is UDP straight from the
    # browser. Upstream also publishes colibri on 127.0.0.1:8080, which is a
    # popular port on a development machine, so the list is replaced rather than
    # extended.
    ports: !override
      - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
    volumes: !override
      - jitsi-jvb-config:/config
    networks:
      - meet.jitsi

volumes:
  caddy-data:
  caddy-config:
  jitsi-web-config:
  jitsi-web-storage:
  jitsi-web-transcripts:
  jitsi-web-crontabs:
  jitsi-web-load-test:
  jitsi-prosody-config:
  jitsi-prosody-storage:
  jitsi-jicofo-config:
  jitsi-jvb-config:

networks:
  # Zulip and its four backing services.
  default:
  # The trust boundary the internal hook is protected by: a pinned subnet so that
  # nginx's allow-list and Zulip's LOADBALANCER_IPS can name it without pinning
  # individual container addresses, which is what the previous deployment had to
  # do.
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.87.0.0/24}
