# The SAML attribute contract between Authentik and Zulip.
#
# This file is in version control while everything under generated/saml/ is not,
# and the split is deliberate. An identity provider *publishes* its entity ID,
# SSO URL and signing certificate, so `consort generate` fetches those from its
# metadata and nobody transcribes them. But *which* attribute carries the email
# address, and which one carries the groups, is an agreement that has to be made
# identically in Authentik and in Zulip. Changing it is a commit, not a
# deployment step.
#
# Every value here is rendered into SOCIAL_AUTH_SAML_ENABLED_IDPS (or
# SOCIAL_AUTH_SYNC_ATTRS_DICT) for *every* profile named in SAML_PROFILES. The
# contract is the same wherever you point; only the URLs differ.
#
# The names on the right are the SAML attribute names Authentik sends. They
# match authentik's own documented Zulip integration, which defines two property
# mappings: "Zulip email" -> email, and "Zulip full name" -> full_name.

# Which attribute identifies the account. attr_user_permanent_id is the one that
# actually ties a SAML identity to a Zulip user; changing it later orphans every
# account provisioned before the change, so it is not a free edit.
attr_user_permanent_id=email
attr_username=email
attr_email=email

# authentik's Zulip mapping sends one full name rather than a split pair. If
# yours splits it, comment this out and set the two below instead — Zulip
# accepts either, and attr_full_name wins if both are present.
attr_full_name=full_name
# attr_first_name=first_name
# attr_last_name=last_name

# Multi-organization installs gate entry to each realm on a SAML attribute
# listing the subdomains a user may enter — that is how the production topology
# in docs/architecture.md works. This deploy is a single organization on the root
# domain, so there is nothing to gate and it stays unset.
# attr_org_membership=member

# Additional attributes to pull out of the assertion, for syncing custom profile
# fields. Comma-separated.
#
# zulip_groups does NOT belong here, and consort drops it with a warning if you
# add it. Zulip collects that attribute on its own, as a list. Listing it here
# instead routes it through python-social-auth's get_attr(), which collapses a
# list to its first element — so group sync would quietly work for exactly one
# group per user, which looks like a mapping mistake rather than a config one.
extra_attrs=

# Create the account on first login instead of asking the visitor whether they
# meant to sign up.
auto_signup=true

# Keep the Zulip display name in step with the directory on every login, rather
# than freezing it at whatever it was on the day the account was made.
sync_full_name=true

# Group sync: which of the names in the assertion's `zulip_groups` attribute
# become Zulip user group memberships. The attribute name is not configurable —
# `zulip_groups` is hardcoded in Zulip's SAML backend.
#
# Empty, the default, is no group sync at all.
#
#   groups=engineering,design          these two names, unchanged, in Zulip
#   groups=ak-eng:engineering,design    ak-eng in Authentik is engineering here
#   groups=*                            every group the IdP sends
#
# `*` is not "sync more groups", it hands Zulip group membership *entirely* to
# Authentik: a user's `zulip_groups` becomes the complete list, so any group you
# made by hand in Zulip and are not a member of in Authentik is removed from you
# at your next login. Groups named in the assertion that do not exist yet are
# created. That is the right model for a directory-driven install and the wrong
# one for a machine you also experiment on, which is why it is not the default.
groups=
