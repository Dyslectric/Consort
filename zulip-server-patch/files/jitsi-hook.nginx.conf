# nginx: expose the jitsi core message hook to the conferencing service only.
#
# Install at /etc/nginx/zulip-include/app.d/jitsi-hook.conf — that directory is
# already pulled in by Zulip's nginx `app` config via
# `include /etc/nginx/zulip-include/app.d/*.conf;`.
#
# Why this works: Zulip ships a `location /api/internal/` that is localhost-only
# (allow 127.0.0.1; allow ::1; deny all;), so a cross-container request from the
# conferencing service gets 403. This block is a MORE-SPECIFIC prefix
# (/api/internal/jitsi/), and nginx routes to the most-specific matching prefix
# regardless of include order — so the service's hook calls land here while every
# other /api/internal/ path stays localhost-only.
#
# The body mirrors Zulip's stock `location /api/` block. On this deployment
# `uwsgi_pass django;` lives INSIDE `uwsgi_params` (confirmed:
# /etc/nginx/uwsgi_params:25), so `include uwsgi_params;` both sets the params and
# routes to Django. Do NOT add a second `uwsgi_pass` here — nginx errors on a
# duplicate.
#
# Two layers of defence, deliberately: the app enforces the bearer secret
# (constant-time, 404 on mismatch); this enforces the network boundary, so the
# most-privileged endpoint in the system is never reachable from the public
# internet via Traefik — only from the shared conferencing subnet.

location /api/internal/jitsi/ {
    allow 127.0.0.1;
    allow ::1;
    # The conferencing service's pinned IP on zulip-conferencing. Must also be in
    # zulip.conf [loadbalancer] ips, or Zulip's proxy-misconfiguration middleware
    # 500s the request before it reaches the view. Widen to 192.168.128.0/20 only
    # if more internal callers need the hook.
    allow 192.168.128.3;
    deny all;

    include /etc/nginx/zulip-include/api_headers;
    include uwsgi_params;
}
